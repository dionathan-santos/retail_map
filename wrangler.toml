name = "retailmap"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

# D1 database backing /functions/api/* (points + category style overrides).
# Create it once with:
#   wrangler d1 create retail-map-db
# then paste the returned database_id below, and apply schema.sql:
#   wrangler d1 execute retail-map-db --file=schema.sql
[[d1_databases]]
binding = "DB"
database_name = "retail-map-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
