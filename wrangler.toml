name = "retailmap"
main = "worker/index.js"
compatibility_date = "2024-11-01"

# Static frontend build output (Vite -> dist/), served by worker/index.js
# via the ASSETS binding for any request that isn't /api/*.
[assets]
directory = "./dist"
binding = "ASSETS"

# D1 database backing worker/index.js's /api/* routes (points + category
# style overrides). Create it once with:
#   wrangler d1 create retail-map-db
# then paste the returned database_id below, and apply schema.sql:
#   wrangler d1 execute retail-map-db --remote --file=schema.sql
[[d1_databases]]
binding = "DB"
database_name = "retail-map-db"
database_id = "a8e289c2-31cf-484a-8430-27fad42d2a2b"

# Hourly sweep for expired base-map data (points/shapes with project_id IS
# NULL older than 24h) -- see cleanupExpiredBaseMapData in worker/index.js.
[triggers]
crons = ["0 * * * *"]
