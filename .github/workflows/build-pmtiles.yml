name: Build Protomaps PMTiles

# Manually-triggered helper (see README "Building PMTiles without installing
# anything locally"): builds a .pmtiles basemap file from an existing
# .osm.pbf extract, entirely on GitHub's servers, and publishes the result
# as a downloadable build artifact. Useful when you can't install
# Docker/Java locally (e.g. a locked-down work computer).
on:
  workflow_dispatch:
    inputs:
      osm_pbf_url:
        description: "Direct download URL of the .osm.pbf extract (e.g. a GitHub Release asset URL)"
        required: true
        type: string
      output_name:
        description: "Name for the output .pmtiles file"
        required: false
        default: "edmonton.pmtiles"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protomaps/basemaps
        uses: actions/checkout@v4
        with:
          repository: protomaps/basemaps
          path: basemaps

      - name: Download OSM extract
        run: |
          mkdir -p basemaps/tiles/data
          curl -fL "${{ inputs.osm_pbf_url }}" -o basemaps/tiles/data/input.osm.pbf

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build tiles JAR
        working-directory: basemaps/tiles
        run: mvn --batch-mode clean package -DskipTests

      - name: Generate PMTiles
        working-directory: basemaps/tiles
        run: |
          java -jar target/*-with-deps.jar \
            --osm-path=data/input.osm.pbf \
            --output=data/${{ inputs.output_name }} \
            --force

      - name: Upload PMTiles artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmtiles-output
          path: basemaps/tiles/data/*.pmtiles
          retention-days: 7
